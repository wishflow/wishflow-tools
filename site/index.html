<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8faf5" />
    <meta name="description" content="A collection of small tools and experiments by WishFlow." />
    <title>WishFlow Tools</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172318; background: #f8faf5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 85% 0%, #e7f7d6 0, transparent 36rem), #f8faf5; }
      wishflow-site-shell { --shell-paper: #f8faf5; }
      .home-content { width: min(960px, calc(100% - 48px)); margin: 0 auto; padding: 58px 0 42px; }
      .eyebrow { margin: 0 0 14px; color: #4c8d18; font-size: 13px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(42px, 8vw, 76px); letter-spacing: -.065em; line-height: 1; }
      .intro { max-width: 620px; margin: 22px 0 48px; color: #58655a; font-size: 18px; line-height: 1.65; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px; }
      .card { display: flex; min-height: 240px; flex-direction: column; align-items: flex-start; padding: 26px; border: 1px solid #e1e8dc; border-radius: 16px; background: rgba(255,255,255,.84); text-decoration: none; color: inherit; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
      .card:hover { transform: translateY(-3px); border-color: #c7d8b8; box-shadow: 0 16px 34px rgba(35,60,24,.08); }
      .card:focus-visible { outline: 3px solid #6d9f48; outline-offset: 3px; }
      .icon { position: relative; display: grid; width: 48px; height: 48px; place-items: center; overflow: hidden; border-radius: 12px; background: #eaf8dc; font-size: 25px; }
      .icon-image { position: relative; width: 48px; height: 52px; background: transparent; }
      .icon-image img { position: absolute; top: 0; left: 0; display: block; width: 800%; max-width: none; height: 900%; animation: usagi-idle 1250ms steps(5, end) infinite; }
      .card:hover .icon-image img, .card:focus-visible .icon-image img { animation: usagi-card-jumping 1250ms steps(4, end) infinite; }
      @keyframes usagi-idle { to { transform: translateX(-62.5%); } }
      @keyframes usagi-card-jumping { to { transform: translate(-50%, -50%); } }
      h2 { margin: 22px 0 8px; font-size: 21px; letter-spacing: -.02em; }
      .description { margin: 0; color: #657066; line-height: 1.55; }
      .open { margin-top: auto; padding-top: 24px; color: #438215; font-size: 14px; font-weight: 700; }
      @media (max-width: 600px) { .home-content { width: min(100% - 28px, 960px); padding-top: 38px; } .card { min-height: 210px; padding: 22px; } }
      @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } .icon-image img { animation: none !important; transform: none !important; } .card:hover .icon-image img, .card:focus-visible .icon-image img { animation: none !important; transform: translate(0, -50%); } }
    </style>
    <script type="module" src="./site.js"></script>
  </head>
  <body>
    <wishflow-site-shell data-app="home" data-base="./" data-home-href="./" data-title-en="WishFlow Tools" data-title-zh="WishFlow Tools">
    <main class="home-content" slot="content">
      <p class="eyebrow"><span data-locale="en">A collection of small projects</span><span data-locale="zh">一组独立的小项目</span></p>
      <h1>WishFlow Tools</h1>
      <p class="intro"><span data-locale="en">Independent tools and experiments. Choose a project to get started.</span><span data-locale="zh">独立的小工具与实验项目。选择一个入口开始使用。</span></p>
      <section class="grid" data-project-grid aria-label="Projects">
<!-- PROJECT_CARDS -->
      </section>
    </main>
    </wishflow-site-shell>
  </body>
</html>
