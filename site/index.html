<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8faf5" />
    <meta name="description" content="WishFlow Tools：独立的小工具与实验项目。" />
    <title>WishFlow Tools</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172318; background: #f8faf5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 85% 0%, #e7f7d6 0, transparent 36rem), #f8faf5; }
      main { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 88px 0 64px; }
      .eyebrow { margin: 0 0 14px; color: #4c8d18; font-size: 13px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(42px, 8vw, 76px); letter-spacing: -.065em; line-height: 1; }
      .intro { max-width: 580px; margin: 22px 0 54px; color: #58655a; font-size: 18px; line-height: 1.65; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px; }
      .card { display: flex; min-height: 240px; flex-direction: column; align-items: flex-start; padding: 26px; border: 1px solid #e1e8dc; border-radius: 24px; background: rgba(255,255,255,.84); box-shadow: 0 14px 38px rgba(35,60,24,.06); text-decoration: none; color: inherit; transition: transform .18s ease, box-shadow .18s ease; }
      .card:hover { transform: translateY(-3px); box-shadow: 0 20px 44px rgba(35,60,24,.11); }
      .icon { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; background: #eaf8dc; font-size: 25px; }
      h2 { margin: 22px 0 8px; font-size: 21px; }
      .description { margin: 0; color: #657066; line-height: 1.55; }
      .open { margin-top: auto; padding-top: 24px; color: #438215; font-size: 14px; font-weight: 700; }
      footer { margin-top: 44px; color: #8a9588; font-size: 13px; }
      @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A collection of small projects</p>
      <h1>WishFlow Tools</h1>
      <p class="intro">独立的小工具与实验项目。选择一个入口开始使用。</p>
      <section class="grid" aria-label="工具列表">
        <a class="card" href="./duolingo-avatar/">
          <span class="icon" aria-hidden="true">🎨</span>
          <h2>Duolingo Avatar Editor</h2>
          <p class="description">创建、编辑并导出 Duolingo 风格的头像，也可以用文字生成可继续调整的头像配置。</p>
          <span class="open">打开编辑器 →</span>
        </a>
      </section>
      <footer>每个工具独立构建，统一从这里进入。</footer>
    </main>
  </body>
</html>
