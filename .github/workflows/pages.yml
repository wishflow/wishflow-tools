name: Deploy WishFlow Tools and API

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      site_required: ${{ steps.classify.outputs.site_required }}
      worker_required: ${{ steps.classify.outputs.worker_required }}
      test_required: ${{ steps.classify.outputs.test_required }}
      test_matrix: ${{ steps.classify.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/workflow-changes.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/workflow-changes.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  docs-only:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate documentation diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$zero_sha" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: apps/${{ matrix.app }}/pnpm-lock.yaml
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install project dependencies
        run: ./apps/${{ matrix.app }}/scripts/install.sh

      - name: Run project tests
        run: pnpm --dir apps/${{ matrix.app }} run test:ci
        env:
          CHROME_EXEC: ${{ steps.setup-chrome.outputs.chrome-path }}

  test-pet-windows:
    runs-on: windows-latest
    needs: changes
    if: >-
      needs.changes.outputs.test_required == 'true' &&
      contains(fromJSON(needs.changes.outputs.test_matrix).app, 'pet')
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pet app dependencies
        run: pnpm --dir apps/pet install --frozen-lockfile

      - name: Run pet app tests
        run: pnpm --dir apps/pet run test:ci

      - name: Verify Windows PowerShell installer
        shell: powershell
        run: ./apps/pet/tests/verify-windows.ps1

  test-shared:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test_required == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test catalog and change classification
        run: pnpm run test:catalog

  validate-cloudflare-config:
    runs-on: ubuntu-latest
    needs: [changes, test, test-shared]
    if: >-
      always() && needs.changes.outputs.worker_required == 'true' &&
      needs.test.result == 'success' && needs.test-shared.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: apps/duolingo-avatar/pnpm-lock.yaml
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install avatar editor dependencies
        run: pnpm --dir apps/duolingo-avatar install --frozen-lockfile

      - name: Validate Cloudflare AI configuration
        run: pnpm run check:cloudflare-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-github-pages:
    runs-on: ubuntu-latest
    needs: [changes, test, test-shared, test-pet-windows]
    if: >-
      always() && needs.changes.outputs.site_required == 'true' &&
      needs.test.result == 'success' && needs.test-shared.result == 'success' &&
      (needs.test-pet-windows.result == 'success' || needs.test-pet-windows.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: |
            apps/ball-growth-lab/pnpm-lock.yaml
            apps/duolingo-avatar/pnpm-lock.yaml
            apps/simple-house/pnpm-lock.yaml
            apps/pet/pnpm-lock.yaml
          run_install: false

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install all registered app dependencies
        run: pnpm run install:apps

      - name: Prepare complete shared site
        run: pnpm run build:site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    needs: [changes, test, test-shared, test-pet-windows]
    if: >-
      always() && needs.changes.outputs.site_required == 'true' &&
      needs.test.result == 'success' && needs.test-shared.result == 'success' &&
      (needs.test-pet-windows.result == 'success' || needs.test-pet-windows.result == 'skipped')
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: |
            apps/ball-growth-lab/pnpm-lock.yaml
            apps/duolingo-avatar/pnpm-lock.yaml
            apps/simple-house/pnpm-lock.yaml
            apps/pet/pnpm-lock.yaml
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install all registered app dependencies
        run: pnpm run install:apps

      - name: Prepare complete shared site
        run: pnpm run build:site

      - name: Deploy Cloudflare Pages
        run: pnpm run deploy:cf:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cloudflare-worker:
    runs-on: ubuntu-latest
    needs: [changes, validate-cloudflare-config]
    if: >-
      always() && needs.changes.outputs.worker_required == 'true' &&
      needs.validate-cloudflare-config.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: apps/duolingo-avatar/pnpm-lock.yaml
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install avatar editor dependencies
        run: pnpm --dir apps/duolingo-avatar install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        run: pnpm run deploy:cf:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
