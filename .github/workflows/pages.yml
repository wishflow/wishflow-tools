name: Deploy WishFlow Tools and API

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      site_required: ${{ steps.classify.outputs.site_required }}
      worker_required: ${{ steps.classify.outputs.worker_required }}
      test_required: ${{ steps.classify.outputs.test_required }}
      test_matrix: ${{ steps.classify.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/workflow-changes.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/workflow-changes.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  docs-only:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate documentation diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$zero_sha" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install project dependencies
        run: ./apps/${{ matrix.app }}/scripts/install.sh

      - name: Run project tests
        run: npm --prefix apps/${{ matrix.app }} run test:ci
        env:
          CHROME_EXEC: ${{ steps.setup-chrome.outputs.chrome-path }}

  test-shared:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test_required == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test catalog and change classification
        run: npm run test:catalog

  validate-cloudflare-config:
    runs-on: ubuntu-latest
    needs: [changes, test, test-shared]
    if: >-
      always() && needs.changes.outputs.worker_required == 'true' &&
      needs.test.result == 'success' && needs.test-shared.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install avatar editor dependencies
        run: npm ci --prefix apps/duolingo-avatar

      - name: Validate Cloudflare AI configuration
        run: npm run check:cloudflare-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-github-pages:
    runs-on: ubuntu-latest
    needs: [changes, test, test-shared]
    if: >-
      always() && needs.changes.outputs.site_required == 'true' &&
      needs.test.result == 'success' && needs.test-shared.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install all registered app dependencies
        run: npm run install:apps

      - name: Prepare complete shared site
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    needs: [changes, test, test-shared]
    if: >-
      always() && needs.changes.outputs.site_required == 'true' &&
      needs.test.result == 'success' && needs.test-shared.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install all registered app dependencies
        run: npm run install:apps

      - name: Prepare complete shared site
        run: npm run build:site

      - name: Deploy Cloudflare Pages
        run: npm run deploy:cf:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cloudflare-worker:
    runs-on: ubuntu-latest
    needs: [changes, validate-cloudflare-config]
    if: >-
      always() && needs.changes.outputs.worker_required == 'true' &&
      needs.validate-cloudflare-config.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install avatar editor dependencies
        run: npm ci --prefix apps/duolingo-avatar

      - name: Deploy Cloudflare Worker
        run: npm run deploy:cf:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
